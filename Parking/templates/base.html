{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parking System{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jersey+15&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script defer src="{% static 'js/main.js' %}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="page-layout">
        <div class="sidebar">
            <header>
                <img class="logo" src="/static/images/logo2.png" alt="Logo">
            </header>
            <nav>
                <ul>
                    <li title="Registrar Vehículo" id="btnAbrirModalVehiculo"><i class="bi bi-car-front-fill"></i></i>
                        <span class="link-text">
                            <span class="menu-line">Agregar</span>
                        </span>
                    </li>
                    <li title="About"><i class="bi bi-plus-square-fill"></i><span class="link-text">About</span></li>
                    <li title="Services"><i class="bi bi-info-circle-fill"></i><span class="link-text">Services</span></li>
                    <li title="Contact"><i class="bi bi-telephone-fill"></i><span class="link-text">Contact</span></li>
                    <li class="logout" id="logoutBtn" title="Cerrar sesión" style="cursor: pointer;">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="link-text">Logout</span>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="content">
            <main>
                {% block content %}
                {% endblock %}
            </main>
            <footer>
                <p>© 2025 - Todos los derechos reservados</p>
            </footer>
        </div>
    </div>

    <!-- Modal para registrar vehículo -->
    <div class="modal fade" id="modalVehiculo" tabindex="-1" aria-labelledby="modalVehiculoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-center w-100" id="modalVehiculoLabel">Registrar Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modalVehiculoBody">
                    
                </div>
            </div>
        </div>
    </div>  

</body>
</html>
