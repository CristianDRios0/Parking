{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jersey+15&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container_login">
        <h2 class="titulo fuente_textos_titulos">Iniciar Sesión</h2>
        {% if messages %}
            {% for message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="post" class="center fuente_textos">
            {% csrf_token %}
            <label for="username">Usuario:</label>
            <input type="text" name="username" required><br><br>
    
            <label for="password">Contraseña:</label>
            <input type="password" name="password" required><br><br>
    
            <button type="submit" class="boton_login fuente_textos">Entrar</button>
        </form>
    </div>
</body>
</html>
