<div class="modal-header">
    <h5 class="modal-title">Detalle de Celda: {{ celda.codigo }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    {% if vehiculo %}
        <p class="texto_detalle"><strong>Placa:</strong> {{ vehiculo.placa }}</p>
        <p class="texto_detalle"><strong>Cliente:</strong> {{ vehiculo.cliente.nombre }}</p>
    {% else %}
        <p>No hay vehículo asignado actualmente.</p>
    {% endif %}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
    {% if parqueo %}
        <button type="button" class="btn btn-success generar-pago-btn" data-parqueo-id="{{ parqueo.id }}">
            Generar Pago
        </button>
    {% endif %}
</div>
