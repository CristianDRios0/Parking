{% extends 'base.html' %}

{% block content %}
<div class="title">
    <h2>SISTEMA PARQUEADERO</h2>
</div>
<div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearCelda" id="btnAbrirModalCelda">
        Crear Celda
    </button>
</div>
<div class="celdas_content">
    {% for celda in celdas %}
        <div class="cell {{ celda.estado|lower }}">{{ celda.codigo }}</div>
    {% endfor %}
</div>   

<div class="modal fade" id="modalCrearCelda" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Crear Nueva Celda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body-content">
                {% include 'celdas/formulario_celda.html' %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
